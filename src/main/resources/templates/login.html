<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Shack - Secure Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(110, 69, 226, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(136, 211, 206, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Navbar */
        .navbar {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(136, 211, 206, 0.1);
        }

        .navbar h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .navbar .links {
            display: flex;
            gap: 2rem;
        }

        .navbar a {
            color: #88d3ce;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #88d3ce;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        /* Main container */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin-top: 60px;
        }

        /* Form container */
        .form-wrapper {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(136, 211, 206, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #88d3ce;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* Alert messages */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .logout-message {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* Form group */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e5e7eb;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid rgba(136, 211, 206, 0.2);
            border-radius: 8px;
            background: rgba(31, 41, 55, 0.8);
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            outline: none;
            background: rgba(31, 41, 55, 0.95);
            border-color: #88d3ce;
            box-shadow: 0 0 0 3px rgba(136, 211, 206, 0.1);
        }

        /* Submit button */
        button {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(110, 69, 226, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Footer text */
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #88d3ce;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #88d3ce;
            transition: width 0.3s ease;
        }

        .form-footer a:hover::after {
            width: 100%;
        }

        /* Footer */
        .footer {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid rgba(136, 211, 206, 0.1);
            font-size: 0.85rem;
        }

        .footer a {
            color: #88d3ce;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .navbar .links {
                gap: 1rem;
                font-size: 0.85rem;
            }

            .form-wrapper {
                padding: 2rem 1.5rem;
                border-radius: 12px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .container {
                margin-top: 120px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>Blogging</h1>
    </div>

    <div class="container">
        <div class="form-wrapper">
            <div th:if="${param.error}">
                <div class="alert error-message">
                    <p>Invalid Username or Password</p>
                </div>
            </div>

            <div th:if="${param.logout}">
                <div class="alert logout-message">
                    <p>Logout Successful!</p>
                </div>
            </div>

            <h2>Login</h2>
            <p class="form-subtitle">Access your DevOps Shack dashboard</p>

            <form th:action="@{/login}" method="post" role="form" th:object="${user}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input th:field="*{username}" type="text" id="username" name="username"
                        placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input th:field="*{password}" type="password" id="password" name="password"
                        placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit">Sign In</button>
            </form>

            <p class="form-footer">Don't have an account? <a th:href="@{/register}">Create one</a></p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2024 DevOps Shack. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
    </div>
</body>

</html>
