<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Posts - Blog Feed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(110, 69, 226, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(136, 211, 206, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Navbar */
        nav {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(136, 211, 206, 0.1);
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-item a {
            color: #88d3ce;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 4px;
        }

        .nav-item a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #88d3ce;
            transition: width 0.3s ease;
        }

        .nav-item a:hover::after {
            width: 100%;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            margin-top: 80px;
            flex: 1;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #88d3ce;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .welcome-message {
            color: #d1d5db;
            font-size: 1rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Posts grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-out;
        }

        /* Card */
        .card {
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(136, 211, 206, 0.15);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            animation: slideUp 0.6s ease-out;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(136, 211, 206, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-text {
            color: #e5e7eb;
            font-size: 1rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .post-author {
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(136, 211, 206, 0.1);
        }

        .post-author span {
            color: #88d3ce;
            font-weight: 600;
        }

        /* Trending section */
        .trending-section {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(136, 211, 206, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            margin-top: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }

        .trending-section h2 {
            color: #88d3ce;
            font-size: 1.75rem;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .trending-item {
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(136, 211, 206, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .trending-item:hover {
            background: rgba(31, 41, 55, 0.9);
            border-color: rgba(136, 211, 206, 0.3);
            transform: translateX(4px);
        }

        .trending-item-icon {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
            display: inline-block;
        }

        .trending-item-title {
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }

        /* Footer */
        .footer {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid rgba(136, 211, 206, 0.1);
            margin-top: auto;
            font-size: 0.85rem;
        }

        .footer a {
            color: #88d3ce;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .trending-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .container {
                padding: 1rem;
                margin-top: 100px;
            }

            nav {
                padding: 1rem;
            }

            .navbar-nav {
                gap: 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="navbar-content">
            <a class="navbar-brand" th:href="@{/}">Blogging</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/add}">Add Post</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Daily Posts</h1>
            <p class="welcome-message">Welcome to your daily dose of the latest posts. Explore what's trending, share your thoughts, and stay connected with the community.</p>
        </div>

        <div class="posts-grid">
            <div class="card" th:each="post : ${posts}">
                <div class="card-body">
                    <p class="card-text" th:text="${post.content}"></p>
                    <div class="post-author">
                        <span th:text="${post.user.username}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="trending-section">
            <h2>Trending Topics</h2>
            <div class="trending-grid">
                <div class="trending-item">
                    <div class="trending-item-icon">🔥</div>
                    <div class="trending-item-title">#BreakingNews</div>
                </div>
                <div class="trending-item">
                    <div class="trending-item-icon">💡</div>
                    <div class="trending-item-title">#TechInnovations</div>
                </div>
                <div class="trending-item">
                    <div class="trending-item-icon">🎉</div>
                    <div class="trending-item-title">#FunFriday</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; Made by Abhishek Badole.</p>
    </div>
</body>
</html>
