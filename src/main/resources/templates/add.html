<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Blogging</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(110, 69, 226, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(136, 211, 206, 0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Navbar */
        nav {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(136, 211, 206, 0.1);
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-item a {
            color: #88d3ce;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 4px;
        }

        .nav-item a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #88d3ce;
            transition: width 0.3s ease;
        }

        .nav-item a:hover::after {
            width: 100%;
        }

        /* Main container */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            margin-top: 100px;
            flex: 1;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #88d3ce;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .form-subtitle {
            color: #d1d5db;
            font-size: 0.95rem;
        }

        /* Form wrapper */
        .form-wrapper {
            background: rgba(20, 20, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(136, 211, 206, 0.15);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Form group */
        .form-group {
            margin-bottom: 2rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            color: #e5e7eb;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 1px solid rgba(136, 211, 206, 0.2);
            border-radius: 8px;
            background: rgba(31, 41, 55, 0.8);
            color: #ffffff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #6b7280;
        }

        textarea:focus {
            outline: none;
            background: rgba(31, 41, 55, 0.95);
            border-color: #88d3ce;
            box-shadow: 0 0 0 3px rgba(136, 211, 206, 0.1);
        }

        /* Character counter */
        .char-counter {
            text-align: right;
            color: #9ca3af;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .char-counter.warning {
            color: #fbbf24;
        }

        .char-counter.limit {
            color: #ef4444;
        }

        /* Submit button */
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(110, 69, 226, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        .footer {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 2rem;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid rgba(136, 211, 206, 0.1);
            margin-top: auto;
            font-size: 0.85rem;
        }

        .footer a {
            color: #88d3ce;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: #ffffff;
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1rem;
                margin-top: 110px;
            }

            .form-wrapper {
                padding: 1.5rem;
            }

            textarea {
                min-height: 150px;
            }

            nav {
                padding: 1rem;
            }

            .navbar-nav {
                gap: 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="navbar-content">
            <a class="navbar-brand" th:href="@{/}">Blogging</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/add}">Add Post</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Create Post</h1>
            <p class="form-subtitle">Share your thoughts with the community</p>
        </div>

        <div class="form-wrapper">
            <form th:action="@{/add}" method="post">
                <div class="form-group">
                    <label for="content">What's on your mind?</label>
                    <textarea id="content" name="content" placeholder="Share your thoughts..." required maxlength="280"></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span>/280
                    </div>
                </div>

                <button type="submit">Post</button>
            </form>
        </div>
    </div>

   <div class="footer">
        <p>&copy; Made by Abhishek Badole.</p>
    </div>

    <script>
        const textarea = document.getElementById('content');
        const charCount = document.getElementById('charCount');
        const counter = document.querySelector('.char-counter');

        textarea.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;

            counter.classList.remove('warning', 'limit');
            if (count > 240) {
                counter.classList.add('limit');
            } else if (count > 200) {
                counter.classList.add('warning');
            }
        });
    </script>
</body>
</html>
